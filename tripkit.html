    edit:<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

}

// ============ STYLES ============
const inp={width:"100%",padding:"10px 14px",fontSize:15,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,outline:"none",boxSizing:"border-box",marginBottom:8,fontFamily:"inherit"};
const lbl={display:"block",fontSize:13,fontWeight:600,color:C.textMuted,marginBottom:6};
const topBarS={display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 4px 12px"};
const backBtnS={display:"flex",alignItems:"center",gap:4,background:"none",border:"none",color:C.accent,cursor:"pointer",fontSize:14,fontWeight:500};

// ============ MAIN APP ============
function TripOrganizer(){
  const[trips,setTrips]=useState([]);
  const[groups,setGroups]=useState([]);
  const[view,setView]=useState("home");
  const[currentTrip,setCT]=useState(null);
  const[currentGroup,setCG]=useState(null);
  const[aiLoading,setAiLoading]=useState(false);
  const[tab,setTab]=useState("gear");

  useEffect(()=>{setTrips(lsGet("tripkit_trips"));setGroups(lsGet("tripkit_groups"));},[]);

  const persistTrips=(t)=>{setTrips(t);lsSet("tripkit_trips",t);};
  const persistGroups=(g)=>{setGroups(g);lsSet("tripkit_groups",g);};

  const openTrip=(trip)=>{setCT(trip);setTab("gear");setView("trip");};

  const deleteTrip=(trip)=>{const u=trips.filter(t=>t.id!==trip.id);persistTrips(u);};

  const saveCurrentTrip=(trip)=>{setCT(trip);const u=trips.map(t=>t.id===trip.id?trip:t);persistTrips(u);};

  const createTrip=(trip)=>{const u=[...trips,trip];persistTrips(u);openTrip(trip);};

  const saveGroup=(group)=>{
    const exists=groups.find(g=>g.id===group.id);
    const u=exists?groups.map(g=>g.id===group.id?group:g):[...groups,group];
    persistGroups(u);
  };
  const deleteGroup=(group)=>{persistGroups(groups.filter(g=>g.id!==group.id));};

  return(
    <div style={{fontFamily:"'Rubik','Segoe UI',Arial,sans-serif",background:C.bg,color:C.text,minHeight:"100vh",maxWidth:520,margin:"0 auto",position:"relative",paddingBottom:80}} dir="rtl">
      {view==="home"&&<HomeScreen trips={trips} onOpen={openTrip} onDelete={deleteTrip} onCreate={()=>setView("create")} onGroups={()=>setView("groups")}/>}
      {view==="create"&&<CreateTripScreen onBack={()=>setView("home")} onCreate={createTrip} allGroups={groups}/>}
      {view==="trip"&&currentTrip&&<TripDetailScreen trip={currentTrip} tab={tab} setTab={setTab} onSave={saveCurrentTrip} onBack={()=>{setView("home");setTrips(lsGet("tripkit_trips"));}} aiLoading={aiLoading} setAiLoading={setAiLoading}/>}
      {view==="groups"&&<GroupsListScreen groups={groups} onBack={()=>setView("home")} onEdit={(g)=>{setCG(g);setView("editGroup");}} onCreate={()=>{setCG(null);setView("editGroup");}} onDelete={deleteGroup}/>}
      {view==="editGroup"&&<EditGroupScreen group={currentGroup} onBack={()=>setView("groups")} onSave={(g)=>{saveGroup(g);setView("groups");}}/>}
    </div>
  );
}

// ============ EDIT GROUP ============
function EditGroupScreen({group,onBack,onSave}){
  const isNew=!group;
  const[form,setForm]=useState(group||{id:gid(),name:"",icon:"👥",members:[{id:gid(),name:"",isChild:false,age:""}]});
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));
  const addM=()=>setForm(f=>({...f,members:[...f.members,{id:gid(),name:"",isChild:false,age:""}]}));
  const updM=(id,k,v)=>setForm(f=>({...f,members:f.members.map(m=>m.id===id?{...m,[k]:v}:m)}));
  const rmM=(id)=>setForm(f=>({...f,members:f.members.filter(m=>m.id!==id)}));
  const icons=["👥","👨‍👩‍👧‍👦","💼","🎉","⚽","🏫","🎸","🏋️"];
  const isValid=form.name.trim().length>0;
  const handleSave=()=>{
    if(!isValid)return;
    onSave({...form,name:form.name.trim(),members:form.members.filter(m=>m.name.trim())});
  };

  return(
    <div style={{padding:"0 12px"}}>
      <div style={topBarS}>
        <button onClick={onBack} style={backBtnS}><Icon name="back"/><span>חזרה</span></button>
        <h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>{isNew?"קבוצה חדשה":"עריכת קבוצה"}</h2>
        <div style={{width:70}}/>
      </div>
      <div style={{padding:"8px 0"}}>
        <div style={{marginBottom:20}}><label style={lbl}>שם הקבוצה</label><input style={inp} placeholder='למשל: משפחה, חברים, עבודה' value={form.name} onChange={e=>upd("name",e.target.value)}/></div>
        <div style={{marginBottom:20}}>
          <label style={lbl}>אייקון</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {icons.map(ic=>(<button key={ic} onClick={()=>upd("icon",ic)} style={{fontSize:28,background:form.icon===ic?C.orangeSoft:C.surface,border:`2px solid ${form.icon===ic?C.orange:C.border}`,borderRadius:10,width:48,height:48,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{ic}</button>))}
          </div>
        </div>
        <div style={{marginBottom:20}}>
          <label style={lbl}>חברי הקבוצה</label>
          {form.members.map((m,i)=>(
            <div key={m.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
              <input style={{...inp,flex:1,marginBottom:0}} placeholder={`חבר/ה ${i+1}`} value={m.name} onChange={e=>updM(m.id,"name",e.target.value)}/>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:13,color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}>
                <input type="checkbox" checked={m.isChild} onChange={e=>updM(m.id,"isChild",e.target.checked)}/><span>ילד/ה</span>
              </label>
              {m.isChild&&<input style={{...inp,width:60,marginBottom:0}} type="number" placeholder="גיל" min="0" max="17" value={m.age} onChange={e=>updM(m.id,"age",e.target.value)}/>}
              {form.members.length>1&&<button onClick={()=>rmM(m.id)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:16,padding:4}}>✕</button>}
            </div>
          ))}
          <button onClick={addM} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10,color:C.orange,cursor:"pointer",fontSize:13,fontWeight:500,fontFamily:"inherit"}}><Icon name="plus" size={16}/><span>הוסף חבר/ה</span></button>
        </div>
        <button onClick={handleSave} disabled={!isValid} style={{width:"100%",padding:14,fontSize:17,fontWeight:700,background:C.orange,color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"inherit",opacity:isValid?1:0.5}}>
          {isNew?"✨ צור קבוצה":"💾 שמור שינויים"}
        </button>
      </div>
    </div>
  );
}

// ============ CREATE TRIP ============
function CreateTripScreen({onBack,onCreate,allGroups}){
  const[form,setForm]=useState({name:"",type:"hiking",destination:"",startDate:"",endDate:"",gearLevel:"optimal",participants:[{id:gid(),name:"",isChild:false,age:""}]});
  const[showGroups,setShowGroups]=useState(false);
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));
  const addP=()=>setForm(f=>({...f,participants:[...f.participants,{id:gid(),name:"",isChild:false,age:""}]}));
  const updP=(id,k,v)=>setForm(f=>({...f,participants:f.participants.map(p=>p.id===id?{...p,[k]:v}:p)}));
  const rmP=(id)=>setForm(f=>({...f,participants:f.participants.filter(p=>p.id!==id)}));
  const importGroup=(group)=>{
    const nm=group.members.filter(m=>m.name).map(m=>({...m,id:gid()}));
    setForm(f=>{
      const ex=f.participants.filter(p=>p.name.trim());
      const toAdd=nm.filter(n=>!ex.find(e=>e.name===n.name));
      const combined=[...ex,...toAdd];
      return{...f,participants:combined.length>0?combined:[{id:gid(),name:"",isChild:false,age:""}]};
    });
    setShowGroups(false);
  };
  const handleCreate=()=>{
    if(!form.name||!form.destination||!form.startDate)return;
    let gear=[...(BASE_GEAR[form.type]?.[form.gearLevel]||[])].map(g=>({...g,id:gid(),isAI:false}));
    form.participants.filter(p=>p.isChild&&p.age).forEach(p=>{
      const ag=getAgeGroup(parseInt(p.age));
      (KIDS_GEAR[ag]||[]).forEach(item=>{
        if(!gear.find(g=>g.name===item.name))gear.push({...item,id:gid(),isAI:false,childNote:`עבור ${p.name||"ילד/ה"} (גיל ${p.age})`});
      });
    });
    onCreate({...form,id:gid(),gear,schedule:[],createdAt:new Date().toISOString()});
  };
  const isValid=form.name&&form.destination&&form.startDate;

  return(
    <div style={{padding:"0 12px"}}>
      <div style={topBarS}>
        <button onClick={onBack} style={backBtnS}><Icon name="back"/><span>חזרה</span></button>
        <h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>טיול חדש</h2>
        <div style={{width:70}}/>
      </div>
      <div style={{padding:"8px 0"}}>
        <div style={{marginBottom:20}}><label style={lbl}>שם הטיול</label><input style={inp} placeholder='למשל: סופ"ש בחרמון' value={form.name} onChange={e=>upd("name",e.target.value)}/></div>
        <div style={{marginBottom:20}}>
          <label style={lbl}>סוג טיול</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {TRIP_TYPES.map(t=>(<button key={t.id} onClick={()=>upd("type",t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"14px 8px",background:form.type===t.id?C.accentSoft:C.surface,border:`1px solid ${form.type===t.id?C.accent:C.border}`,borderRadius:12,cursor:"pointer",color:form.type===t.id?C.accent:C.textMuted,fontSize:12,fontFamily:"inherit"}}><span style={{fontSize:24}}>{t.icon}</span><span style={{fontWeight:600}}>{t.label}</span></button>))}
          </div>
        </div>
        <div style={{marginBottom:20}}><label style={lbl}>יעד</label><input style={inp} placeholder="לאן נוסעים?" value={form.destination} onChange={e=>upd("destination",e.target.value)}/></div>
        <div style={{display:"flex",gap:12,marginBottom:20}}>
          <div style={{flex:1}}><label style={lbl}>מתאריך</label><input style={inp} type="date" value={form.startDate} onChange={e=>upd("startDate",e.target.value)}/></div>
          <div style={{flex:1}}><label style={lbl}>עד תאריך</label><input style={inp} type="date" value={form.endDate} onChange={e=>upd("endDate",e.target.value)}/></div>
        </div>
        <div style={{marginBottom:20}}>
          <label style={lbl}>רמת ציוד</label>
          <div style={{display:"flex",gap:8}}>
            {GEAR_LEVELS.map(g=>(<button key={g.id} onClick={()=>upd("gearLevel",g.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"12px 6px",background:form.gearLevel===g.id?C.accentSoft:C.surface,border:`1px solid ${form.gearLevel===g.id?C.accent:C.border}`,borderRadius:12,cursor:"pointer",color:form.gearLevel===g.id?C.accent:C.textMuted,fontFamily:"inherit"}}><span style={{fontSize:22}}>{g.icon}</span><span style={{fontSize:13,fontWeight:600}}>{g.label}</span><span style={{fontSize:10,textAlign:"center",lineHeight:1.3}}>{g.desc}</span></button>))}
          </div>
        </div>
        <div style={{marginBottom:20}}>
          <label style={lbl}>משתתפים</label>
          {allGroups.length>0&&(
            <div style={{marginBottom:10}}>
              <button onClick={()=>setShowGroups(!showGroups)} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",padding:"10px",background:C.orangeSoft,border:`1px solid ${C.orange}`,borderRadius:10,color:C.orange,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}><Icon name="download" size={16}/><span>ייבא מקבוצה</span></button>
              {showGroups&&(
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,marginTop:6,overflow:"hidden"}}>
                  {allGroups.map(g=>(
                    <button key={g.id} onClick={()=>importGroup(g)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"12px 14px",background:"none",border:"none",borderBottom:`1px solid ${C.border}`,color:C.text,cursor:"pointer",fontFamily:"inherit",fontSize:14,textAlign:"right"}}>
                      <span style={{fontSize:22}}>{g.icon||"👥"}</span>
                      <div style={{flex:1}}><div style={{fontWeight:600}}>{g.name}</div><div style={{fontSize:11,color:C.textMuted}}>{g.members?.filter(m=>m.name).map(m=>m.name).join(", ")}</div></div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
          {form.participants.map((p,i)=>(
            <div key={p.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
              <input style={{...inp,flex:1,marginBottom:0}} placeholder={`משתתף ${i+1}`} value={p.name} onChange={e=>updP(p.id,"name",e.target.value)}/>
              <label style={{display:"flex",alignItems:"center",gap:4,fontSize:13,color:C.textMuted,cursor:"pointer",whiteSpace:"nowrap"}}><input type="checkbox" checked={p.isChild} onChange={e=>updP(p.id,"isChild",e.target.checked)}/><span>ילד/ה</span></label>
              {p.isChild&&<input style={{...inp,width:60,marginBottom:0}} type="number" placeholder="גיל" min="0" max="17" value={p.age} onChange={e=>updP(p.id,"age",e.target.value)}/>}
              {form.participants.length>1&&<button onClick={()=>rmP(p.id)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:16,padding:4}}>✕</button>}
            </div>
          ))}
          <button onClick={addP} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10,color:C.accent,cursor:"pointer",fontSize:13,fontWeight:500,fontFamily:"inherit"}}><Icon name="plus" size={16}/><span>הוסף משתתף</span></button>
        </div>
        <button onClick={handleCreate} disabled={!isValid} style={{width:"100%",padding:14,fontSize:17,fontWeight:700,background:C.accent,color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"inherit",marginTop:8,opacity:isValid?1:0.5}}>🚀 צור טיול</button>
      </div>
    </div>
  );
}

// ============ TRIP DETAIL ============
function TripDetailScreen({trip,tab,setTab,onSave,onBack,aiLoading,setAiLoading}){
  const[newItem,setNewItem]=useState("");
  const[newCat,setNewCat]=useState("");
  const[schedForm,setSchedForm]=useState({day:"",title:"",notes:""});
  const[aiItems,setAiItems]=useState([]);
  const[filter,setFilter]=useState("all");

  const ti=TRIP_TYPES.find(t=>t.id===trip.type);
  const li=GEAR_LEVELS.find(g=>g.id===trip.gearLevel);

  const togglePacked=id=>{onSave({...trip,gear:trip.gear.map(g=>g.id===id?{...g,packed:!g.packed}:g)});};
  const addGear=()=>{if(!newItem.trim())return;onSave({...trip,gear:[...trip.gear,{id:gid(),name:newItem.trim(),category:newCat.trim()||"כללי",packed:false,isAI:false}]});setNewItem("");setNewCat("");};
  const rmGear=id=>onSave({...trip,gear:trip.gear.filter(g=>g.id!==id)});

  const handleAI=async()=>{
    setAiLoading(true);setAiItems([]);
    try{
      const ki=trip.participants.filter(p=>p.isChild).map(p=>`ילד/ה בגיל ${p.age}`).join(", ");
      const prompt=`אתה מומחה לטיולים וציוד שטח.\nפרטי הטיול:\n- סוג: ${ti?.label}\n- יעד: ${trip.destination}\n- תאריכים: ${trip.startDate} עד ${trip.endDate}\n- משתתפים: ${trip.participants.length}\n${ki?`- ילדים: ${ki}`:"- ללא ילדים"}\n- רמת ציוד: ${li?.label}\n\nתן רשימת ציוד נוסף שחשוב לקחת. החזר JSON בלבד ללא backticks:\n[{"name":"שם","category":"קטגוריה","reason":"למה"}]\nתן 5-15 פריטים ספציפיים.`;
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      if(!res.ok)throw new Error(`API ${res.status}`);
      const data=await res.json();
      const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      setAiItems(JSON.parse(text.replace(/```json|```/g,"").trim()));
    }catch(e){setAiItems([{name:`שגיאה: ${e.message}`,category:"שגיאה",reason:"נסה שוב"}]);}
    setAiLoading(false);
  };
  const addAI=item=>{onSave({...trip,gear:[...trip.gear,{id:gid(),name:item.name,category:item.category,packed:false,isAI:true,reason:item.reason}]});setAiItems(p=>p.filter(i=>i.name!==item.name));};
  const addAllAI=()=>{const ng=aiItems.filter(i=>!trip.gear.find(g=>g.name===i.name)).map(i=>({id:gid(),name:i.name,category:i.category,packed:false,isAI:true,reason:i.reason}));onSave({...trip,gear:[...trip.gear,...ng]});setAiItems([]);};

  const addSched=()=>{if(!schedForm.day||!schedForm.title)return;onSave({...trip,schedule:[...trip.schedule,{id:gid(),...schedForm}]});setSchedForm({day:"",title:"",notes:""});};
  const rmSched=id=>onSave({...trip,schedule:trip.schedule.filter(s=>s.id!==id)});

  const fG=filter==="packed"?trip.gear.filter(g=>g.packed):filter==="unpacked"?trip.gear.filter(g=>!g.packed):trip.gear;
  const pC=trip.gear.filter(g=>g.packed).length,tC=trip.gear.length;
  const prog=tC>0?Math.round(pC/tC*100):0;
  const grouped={};fG.forEach(i=>{if(!grouped[i.category])grouped[i.category]=[];grouped[i.category].push(i);});

  const tabBtn=a=>({flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 8px",background:a?C.accentSoft:"none",border:"none",color:a?C.accent:C.textMuted,fontSize:14,fontWeight:500,cursor:"pointer",borderRadius:10,fontFamily:"inherit"});
  const fChip=a=>({padding:"6px 12px",fontSize:12,background:a?C.accentSoft:C.surface2,border:`1px solid ${a?C.accent:C.border}`,borderRadius:20,color:a?C.accent:C.textMuted,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"});

  return(
    <div style={{padding:"0 12px"}}>
      <div style={topBarS}>
        <button onClick={onBack} style={backBtnS}><Icon name="back"/><span>חזרה</span></button>
        <h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>{ti?.icon} {trip.name}</h2>
        <div style={{width:50}}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"0 4px 8px"}}>
        <span style={{fontSize:12,background:C.surface2,padding:"5px 10px",borderRadius:20,color:C.textMuted}}>📍 {trip.destination}</span>
        <span style={{fontSize:12,background:C.surface2,padding:"5px 10px",borderRadius:20,color:C.textMuted}}>📅 {trip.startDate}</span>
        <span style={{fontSize:12,background:C.surface2,padding:"5px 10px",borderRadius:20,color:C.textMuted}}>{li?.icon} {li?.label}</span>
        <span style={{fontSize:12,background:C.surface2,padding:"5px 10px",borderRadius:20,color:C.textMuted}}>👥 {trip.participants?.length}</span>
      </div>
      <div style={{padding:"12px 4px 8px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,color:C.textMuted}}>התקדמות אריזה</span><span style={{fontSize:14,fontWeight:700,color:C.accent}}>{prog}%</span></div>
        <div style={{height:8,background:C.surface2,borderRadius:8,overflow:"hidden"}}><div style={{height:"100%",borderRadius:8,width:`${prog}%`,background:prog===100?C.green:prog>50?C.amber:C.red,transition:"width 0.4s"}}/></div>
        <p style={{fontSize:12,color:C.textMuted,marginTop:4,textAlign:"center"}}>{pC} מתוך {tC} נארזו</p>
      </div>
      <div style={{display:"flex",gap:4,padding:"8px 4px",borderBottom:`1px solid ${C.border}`,marginBottom:12}}>
        <button style={tabBtn(tab==="gear")} onClick={()=>setTab("gear")}><Icon name="list" size={16}/><span>ציוד</span></button>
        <button style={tabBtn(tab==="schedule")} onClick={()=>setTab("schedule")}><Icon name="calendar" size={16}/><span>לו״ז</span></button>
        <button style={tabBtn(tab==="people")} onClick={()=>setTab("people")}><Icon name="user" size={16}/><span>משתתפים</span></button>
      </div>

      {tab==="gear"&&(
        <div>
          <button onClick={handleAI} disabled={aiLoading} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:12,background:C.purpleSoft,border:`1px solid ${C.purple}`,borderRadius:12,color:C.purple,fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>
            {aiLoading?<><div style={{width:18,height:18,border:`2px solid rgba(167,139,250,0.3)`,borderTop:`2px solid ${C.purple}`,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/><span>AI חושב...</span></>:<><Icon name="sparkle" size={18}/><span>העזר ב-AI להכנת רשימה</span></>}
          </button>
          {aiItems.length>0&&(
            <div style={{background:C.purpleSoft,border:"1px solid rgba(167,139,250,0.2)",borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <h4 style={{margin:0,fontSize:14,color:C.purple}}>✨ המלצות AI</h4>
                <button onClick={addAllAI} style={{background:C.purple,color:"#fff",border:"none",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>הוסף הכל</button>
              </div>
              {aiItems.map((item,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid rgba(167,139,250,0.1)"}}>
                  <div style={{flex:1}}><span style={{fontSize:14}}>{item.name}</span>{item.reason&&<div style={{fontSize:11,color:C.textMuted}}>{item.reason}</div>}</div>
                  <button onClick={()=>addAI(item)} style={{background:C.purple,color:"#fff",border:"none",borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}><Icon name="plus" size={14}/></button>
                </div>
              ))}
            </div>
          )}
          <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:4}}>
            <button style={fChip(filter==="all")} onClick={()=>setFilter("all")}>הכל ({tC})</button>
            <button style={fChip(filter==="unpacked")} onClick={()=>setFilter("unpacked")}>לא נארז ({tC-pC})</button>
            <button style={fChip(filter==="packed")} onClick={()=>setFilter("packed")}>נארז ✓ ({pC})</button>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
            <input style={{...inp,flex:1,marginBottom:0}} placeholder="פריט חדש..." value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGear()}/>
            <input style={{...inp,width:90,marginBottom:0}} placeholder="קטגוריה" value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGear()}/>
            <button onClick={addGear} style={{background:C.accent,color:"#fff",border:"none",borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}><Icon name="plus" size={16}/></button>
          </div>
          {Object.entries(grouped).map(([cat,items])=>(
            <div key={cat} style={{marginBottom:16}}>
              <h4 style={{fontSize:13,fontWeight:700,color:C.accent,margin:"0 0 8px",padding:"4px 0",borderBottom:`1px solid ${C.border}`}}>{cat}</h4>
              {items.map(item=>(
                <div key={item.id} onClick={()=>togglePacked(item.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 8px",borderRadius:10,cursor:"pointer",marginBottom:2,background:item.packed?"rgba(34,197,94,0.06)":"transparent"}}>
                  <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${item.packed?C.green:C.border}`,background:item.packed?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff"}}>{item.packed&&<Icon name="check" size={14}/>}</div>
                  <div style={{flex:1}}>
                    <span style={{fontSize:14,textDecoration:item.packed?"line-through":"none",opacity:item.packed?0.6:1}}>
                      {item.name}{item.isAI&&<span style={{display:"inline-block",marginRight:6,fontSize:9,fontWeight:700,background:C.purpleSoft,color:C.purple,padding:"1px 6px",borderRadius:4,verticalAlign:"middle"}}>AI</span>}
                    </span>
                    {item.childNote&&<div style={{fontSize:11,color:C.amber}}>{item.childNote}</div>}
                    {item.reason&&<div style={{fontSize:11,color:C.textMuted,fontStyle:"italic"}}>{item.reason}</div>}
                  </div>
                  <button onClick={e=>{e.stopPropagation();rmGear(item.id);}} style={{background:"none",border:"none",color:C.textDim,cursor:"pointer",padding:4,opacity:0.5}}><Icon name="trash" size={14}/></button>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {tab==="schedule"&&(
        <div>
          <div style={{background:C.surface,borderRadius:12,padding:14,marginBottom:16}}>
            <div style={{display:"flex",gap:12}}>
              <div style={{flex:1}}><label style={lbl}>יום / תאריך</label><input style={inp} placeholder="יום 1" value={schedForm.day} onChange={e=>setSchedForm(f=>({...f,day:e.target.value}))}/></div>
              <div style={{flex:2}}><label style={lbl}>כותרת</label><input style={inp} placeholder="עליה לפסגה" value={schedForm.title} onChange={e=>setSchedForm(f=>({...f,title:e.target.value}))}/></div>
            </div>
            <label style={lbl}>הערות</label>
            <textarea style={{...inp,minHeight:80,resize:"vertical"}} placeholder="פירוט..." value={schedForm.notes} onChange={e=>setSchedForm(f=>({...f,notes:e.target.value}))}/>
            <button onClick={addSched} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10,color:C.accent,cursor:"pointer",fontSize:13,fontWeight:500,fontFamily:"inherit"}}><Icon name="plus" size={16}/><span>הוסף ללו״ז</span></button>
          </div>
          {trip.schedule.length===0?<div style={{textAlign:"center",padding:"40px 16px",color:C.textMuted}}><p>📅 עדיין אין תוכנית</p></div>:(
            <div>{trip.schedule.map((item,i)=>(
              <div key={item.id} style={{display:"flex",gap:12,marginBottom:4}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",paddingTop:4,width:20,flexShrink:0}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:C.accent,boxShadow:`0 0 8px ${C.accentGlow}`}}/>
                  {i<trip.schedule.length-1&&<div style={{width:2,flex:1,background:C.border,marginTop:4}}/>}
                </div>
                <div style={{flex:1,background:C.surface,borderRadius:10,padding:12,marginBottom:8}}>
                  <span style={{fontSize:11,fontWeight:700,color:C.accent}}>{item.day}</span>
                  <h4 style={{margin:"4px 0 2px",fontSize:15,fontWeight:600}}>{item.title}</h4>
                  {item.notes&&<p style={{fontSize:13,color:C.textMuted,margin:"4px 0 0",lineHeight:1.5}}>{item.notes}</p>}
                </div>
                <button onClick={()=>rmSched(item.id)} style={{background:"none",border:"none",color:C.textDim,cursor:"pointer",padding:4,opacity:0.5}}><Icon name="trash" size={14}/></button>
              </div>
            ))}</div>
          )}
        </div>
      )}

      {tab==="people"&&(
        <div>{trip.participants.map(p=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:14,background:C.surface,borderRadius:12,marginBottom:8}}>
            <div style={{fontSize:28}}>{p.isChild?"👧":"🧑"}</div>
            <div><span style={{fontSize:15,fontWeight:600}}>{p.name||"ללא שם"}</span>{p.isChild&&<div style={{fontSize:12,color:C.amber}}>ילד/ה, גיל {p.age}</div>}</div>
          </div>
        ))}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TripOrganizer/>);
</script>
</body>
</html>
