async function geocode(place){
  const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(place)}&format=json&limit=1&accept-language=he`,{headers:{"User-Agent":"TripKit/2.1"}});
  const d=await r.json();if(!d?.length)return null;const p=d[0];
  const parts=p.display_name.split(",");const name=parts[0].trim();const country=parts[parts.length-1]?.trim()||"";
  return{lat:parseFloat(p.lat),lon:parseFloat(p.lon),name,country};
}
async function fetchW(lat,lon,s,e){
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,weathercode&timezone=auto&start_date=${s}&end_date=${e}`);
  if(!r.ok)return null;const d=await r.json();if(!d.daily)return null;
  return d.daily.time.map((t,i)=>({date:t,mx:d.daily.temperature_2m_max[i],mn:d.daily.temperature_2m_min[i],rain:d.daily.precipitation_sum[i],wind:d.daily.windspeed_10m_max[i],code:d.daily.weathercode[i]}));
}
function wSum(w){if(!w?.length)return"";const mx=Math.round(w.reduce((s,d)=>s+d.mx,0)/w.length),mn=Math.round(w.reduce((s,d)=>s+d.mn,0)/w.length),rain=Math.round(w.reduce((s,d)=>s+d.rain,0)*10)/10,wind=Math.round(Math.max(...w.map(d=>d.wind)));return`${mn}°-${mx}°C | גשם: ${rain}מ"מ | רוח: עד ${wind} קמ"ש`;}

/* ===== AI (Gemini) ===== */
function getApiKey(){return localStorage.getItem("tk_gemini_key")||"";}
function setApiKey(k){localStorage.setItem("tk_gemini_key",k);}
async function callAI(prompt){const key=getApiKey();if(!key)throw new Error("NO_KEY");
  async function getModels(){
    try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);if(!r.ok)return[];const d=await r.json();return(d.models||[]).filter(m=>m.supportedGenerationMethods?.includes("generateContent")).map(m=>m.name.replace("models/",""));}catch{return[];}
  }
  async function tryModel(m,p){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:p}]}]})});
    if(!r.ok)throw new Error(`${r.status}`);
    const d=await r.json();return d.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }
  /* Try cached model first */
  const cached=localStorage.getItem("tk_gemini_model");
  if(cached){try{return await tryModel(cached,prompt);}catch{localStorage.removeItem("tk_gemini_model");}}
  /* Find a working model by actually trying each one */
  const all=await getModels();
  const prefer=["gemini-2.5-flash","gemini-2.5-pro","gemini-1.5-flash","gemini-1.5-pro","gemini-pro"];
  const sorted=[...prefer.filter(p=>all.some(a=>a.includes(p))),...all.filter(a=>!prefer.some(p=>a.includes(p)))];
  for(const m of sorted){
    try{const res=await tryModel(m,prompt);localStorage.setItem("tk_gemini_model",m);return res;}catch{continue;}
  }
  throw new Error("אף מודל Gemini לא עבד. בדוק את מפתח ה-API שלך בהגדרות ⚙️");
}

      {loading?spin:<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>}
      {loading?"מתחבר...":"התחבר עם Google"}

/* ===== MAIN (authenticated) ===== */
function Main({user}){
  const[trips,setTrips]=useState([]);
  const[groups,setGroups]=useState([]);
  const[view,setView]=useState("home");
  const[ct,setCt]=useState(null);
  const[cg,setCg]=useState(null);
  const[tab,setTab]=useState("gear");
  const[showCL,setShowCL]=useState(false);
  const[showSet,setShowSet]=useState(false);
  const[cfm,setCfm]=useState(null);
  const[tripsLoaded,setTL]=useState(false);
  const ask=(msg,onOk)=>setCfm({msg,onOk});

  /* Migrate localStorage → Firestore on first login */
  useEffect(()=>{
    if(localStorage.getItem("tk_migrated"))return;
    (async()=>{
      try{
        const old=localStorage.getItem("tk_trips");
        if(old){
          const arr=JSON.parse(old);
          for(const t of arr){
            t.ownerUid=user.uid;t.ownerEmail=user.email;t.ownerName=user.displayName||"";
            t.memberEmails=[user.email];
            await db.collection("trips").doc(t.id).set(t);
          }
          localStorage.removeItem("tk_trips");
        }
        const oldG=localStorage.getItem("tk_groups");
        if(oldG){
          const arr=JSON.parse(oldG);
          for(const g of arr)await db.collection("users").doc(user.uid).collection("groups").doc(g.id).set(g);
          localStorage.removeItem("tk_groups");
        }
        localStorage.setItem("tk_migrated","1");
        showToast("נתונים הועברו לענן בהצלחה","success");
      }catch(e){console.error("Migration:",e);showToast("שגיאה בהעברת נתונים — נסה שוב","error");}
    })();
  },[]);

  /* Real-time trips listener */
  useEffect(()=>{
    return db.collection("trips").where("memberEmails","array-contains",user.email)
      .onSnapshot(snap=>{setTrips(snap.docs.map(d=>({id:d.id,...d.data()})));setTL(true);},
      err=>{console.error(err);setTL(true);});
  },[user.email]);

  /* Real-time groups listener */
  useEffect(()=>{
    return db.collection("users").doc(user.uid).collection("groups")
      .onSnapshot(snap=>setGroups(snap.docs.map(d=>({id:d.id,...d.data()}))));
  },[user.uid]);

  const open=t=>{setCt(t);setTab("gear");setView("trip");};
  const del=t=>ask("למחוק את הטיול \""+t.name+"\"?",async()=>{await db.collection("trips").doc(t.id).delete();});
  const save=async t=>{setCt(t);await db.collection("trips").doc(t.id).set(t);};
  const create=async t=>{await db.collection("trips").doc(t.id).set(t);open(t);};
  const saveG=async g=>{await db.collection("users").doc(user.uid).collection("groups").doc(g.id).set(g);};
  const delG=g=>ask("למחוק את הקבוצה \""+g.name+"\"?",async()=>{await db.collection("users").doc(user.uid).collection("groups").doc(g.id).delete();});
  const logout=()=>auth.signOut();

  if(!tripsLoaded)return bigSpin;

  return(
    <div style={{fontFamily:"'Rubik','Segoe UI',Arial,sans-serif",background:C.bg,color:C.t,minHeight:"100vh",maxWidth:520,margin:"0 auto",position:"relative",paddingBottom:80}} dir="rtl">
      {view==="home"&&<Home user={user} trips={trips} onOpen={open} onDel={del} onCreate={()=>setView("create")} onGroups={()=>setView("groups")} onLogout={logout} onCL={()=>setShowCL(true)} onSettings={()=>setShowSet(true)}/>}
      {view==="create"&&<CreateTrip user={user} onBack={()=>setView("home")} onCreate={create} groups={groups}/>}
      {view==="trip"&&ct&&<TripView user={user} tripId={ct.id} tab={tab} setTab={setTab} onSave={save} onBack={()=>setView("home")}/>}
      {view==="groups"&&<GList groups={groups} onBack={()=>setView("home")} onEdit={g=>{setCg(g);setView("editG");}} onCreate={()=>{setCg(null);setView("editG");}} onDel={delG}/>}
      {view==="editG"&&<GEdit group={cg} onBack={()=>setView("groups")} onSave={g=>{saveG(g);setView("groups");}}/>}
      {showCL&&<Changelog onClose={()=>setShowCL(false)}/>}
      {showSet&&<Settings onClose={()=>setShowSet(false)}/>}
      {cfm&&<Confirm msg={cfm.msg} onOk={()=>{cfm.onOk();setCfm(null);}} onCancel={()=>setCfm(null)}/>}
      <Toasts/>
    </div>
  );
}

    <div style={{textAlign:"center",padding:"16px 16px 12px"}}><div style={{fontSize:48,marginBottom:8}}>🧭</div><h1 style={{fontSize:28,fontWeight:700,margin:0}}>TripKit</h1><p style={{fontSize:14,color:C.tm,margin:"6px 0 0"}}>ארגון טיולים חכם — ציוד, מזג אוויר, ופעילויות</p></div>

    {trips.length===0?(<div style={{textAlign:"center",padding:"48px 16px",background:C.s,borderRadius:16,margin:"8px 0"}}><div style={{fontSize:56}}>🏔️</div><p style={{fontSize:18,fontWeight:600,margin:"12px 0 4px"}}>אין טיולים עדיין</p><p style={{fontSize:13,color:C.tm}}>צור את הטיול הראשון שלך!</p></div>)
    :(<div style={{display:"flex",flexDirection:"column",gap:12}}>{trips.map(t=>{const ti=TT.find(x=>x.id===t.type);const gc=t.gear?.length||0,pc=t.gear?.filter(g=>g.packed).length||0,pr=gc?Math.round(pc/gc*100):0;const shared=t.ownerUid!==user.uid;
    return(<div key={t.id} onClick={()=>onOpen(t)} style={{background:C.s,borderRadius:14,padding:16,cursor:"pointer",border:`1px solid ${C.bd}`}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>

/* ===== CREATE ===== */
function CreateTrip({user,onBack,onCreate,groups}){
  const[f,sF]=useState({name:"",type:"hiking",destination:"",startDate:"",endDate:"",gearLevel:"optimal",participants:[{id:uid(),name:user.displayName||"",isChild:false,age:""}]});
  const[showG,setShowG]=useState(false);const[weather,setW]=useState(null);const[wL,setWL]=useState(false);const[wE,setWE]=useState("");
  const[geo,setGeo]=useState(null);const[acts,setActs]=useState(null);const[actL,setActL]=useState(false);const[creating,setCreating]=useState(false);
  const dt=useRef(null);const geoRef=useRef(null);
  useEffect(()=>()=>clearTimeout(dt.current),[]);

  const upd=(k,v)=>{
    let nf={...f,[k]:v};
    if(k==="endDate"&&nf.startDate&&v&&v<nf.startDate){showToast("תאריך סיום חייב להיות אחרי תאריך התחלה","error");return;}
    if(k==="startDate"&&nf.endDate&&nf.endDate<v){nf={...nf,endDate:""};}
    sF(nf);
    if(k==="destination"&&v.length>2){clearTimeout(dt.current);dt.current=setTimeout(()=>doGeo(v,nf),800);}
    if((k==="startDate"||k==="endDate")&&nf.startDate&&nf.destination)setTimeout(()=>doW(nf),300);
  };

  const doGeo=async(dest,nf)=>{setGeo(null);setActs(null);try{const g=await geocode(dest);if(g){setGeo(g);geoRef.current=g;if(getApiKey()){setActL(true);try{setActs(await getActivities(dest,TT.find(t=>t.id===(nf||f).type)?.label));}catch(e){console.warn("Activities:",e.message);}setActL(false);}if((nf||f).startDate)doW(nf||f,g);}}catch(e){console.warn("Geocode:",e.message);}};
  const doW=async(nf,g)=>{setWL(true);setWE("");setW(null);try{const loc=g||geoRef.current||await geocode(nf.destination);if(!loc){setWE("לא נמצא מיקום");setWL(false);return;}if(!geoRef.current){setGeo(loc);geoRef.current=loc;}const maxD=new Date(Date.now()+16*864e5).toISOString().split("T")[0];if(nf.startDate>maxD){setWE("התאריך רחוק מ-16 יום — AI יעריך עונתית");setWL(false);return;}const ed=nf.endDate&&nf.endDate<=maxD?nf.endDate:nf.endDate>maxD?maxD:nf.startDate;const w=await fetchW(loc.lat,loc.lon,nf.startDate,ed);if(w)setW(w);else setWE("לא ניתן לטעון תחזית");}catch(e){setWE("שגיאה: "+e.message);}setWL(false);};

  const addP=()=>sF(p=>({...p,participants:[...p.participants,{id:uid(),name:"",isChild:false,age:""}]}));
  const updP=(id,k,v)=>sF(p=>({...p,participants:p.participants.map(x=>x.id===id?{...x,[k]:v}:x)}));
  const rmP=id=>sF(p=>({...p,participants:p.participants.filter(x=>x.id!==id)}));
  const importG=g=>{const nm=g.members.filter(m=>m.name).map(m=>({...m,id:uid()}));sF(p=>{const ex=p.participants.filter(x=>x.name.trim());const add=nm.filter(n=>!ex.find(e=>e.name===n.name));const c=[...ex,...add];return{...p,participants:c.length?c:[{id:uid(),name:"",isChild:false,age:""}]};});setShowG(false);};

  const doCreate=async()=>{
    if(!f.name||!f.destination||!f.startDate||creating)return;setCreating(true);
    try{
      let gear=[...(BG[f.type]?.[f.gearLevel]||[])].map(g=>({name:g.n,category:g.c,id:uid(),packed:false,isAI:false}));
      f.participants.filter(p=>p.isChild&&p.age).forEach(p=>{const ag=ageGrp(parseInt(p.age));(KG[ag]||[]).forEach(item=>{if(!gear.find(g=>g.name===item.n))gear.push({name:item.n,category:item.c,id:uid(),packed:false,isAI:false,childNote:`עבור ${p.name||"ילד/ה"} (גיל ${p.age})`});});});
      const mUrl=geo?`https://www.google.com/maps/search/?api=1&query=${geo.lat},${geo.lon}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.destination)}`;
      await onCreate({...f,id:uid(),gear,schedule:[],meals:initMeals(f.startDate,f.endDate||f.startDate),weather,activities:acts,geo,mapsUrl:mUrl,ownerUid:user.uid,ownerEmail:user.email,ownerName:user.displayName||"",memberEmails:[user.email],createdAt:new Date().toISOString()});
    }catch(e){setCreating(false);showToast("שגיאה ביצירת טיול: "+e.message,"error");}
  };
  const ok=f.name&&f.destination&&f.startDate&&!creating;

  return(<div style={{padding:"0 12px"}}>
    <div style={topBar}><button onClick={onBack} style={bBtn}><I n="back"/>חזרה</button><h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>טיול חדש</h2><div style={{width:70}}/></div>
    <div style={{padding:"8px 0"}}>
      <div style={{marginBottom:20}}><label style={lbl}>שם הטיול</label><input style={inp} placeholder='למשל: סופ"ש בחרמון' value={f.name} onChange={e=>upd("name",e.target.value)}/></div>
      <div style={{marginBottom:20}}><label style={lbl}>סוג טיול</label><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{TT.map(t=>(<button key={t.id} onClick={()=>upd("type",t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"14px 8px",background:f.type===t.id?C.as:C.s,border:`1px solid ${f.type===t.id?C.a:C.bd}`,borderRadius:12,cursor:"pointer",color:f.type===t.id?C.a:C.tm,fontSize:12,fontFamily:"inherit"}}><span style={{fontSize:24}}>{t.icon}</span><span style={{fontWeight:600}}>{t.label}</span></button>))}</div></div>

      {/* DESTINATION */}
      <div style={{marginBottom:20}}>
        <label style={lbl}>יעד</label>
        <input style={inp} placeholder="לאן נוסעים?" value={f.destination} onChange={e=>upd("destination",e.target.value)}/>
        {geo&&(<div className="fadeIn" style={{background:C.s,border:`1px solid ${C.bd}`,borderRadius:12,padding:12,marginTop:4}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><I n="map" s={18}/><span style={{fontSize:14,fontWeight:600}}>{geo.name}{geo.country?`, ${geo.country}`:""}</span></div>
          <a href={`https://www.google.com/maps/search/?api=1&query=${geo.lat},${geo.lon}`} target="_blank" rel="noopener" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,color:C.a,textDecoration:"none",padding:"6px 12px",background:C.as,borderRadius:8,marginBottom:8}}>📍 פתח ב-Google Maps</a>
          {actL&&<div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:C.tm}}>{spin} מחפש פעילויות...</div>}
          {acts?.length>0&&(<div style={{marginTop:6}}><p style={{fontSize:12,fontWeight:600,color:C.o,marginBottom:6}}>🎯 פעילויות מומלצות:</p>{acts.map((a,i)=>(<div key={i} style={{padding:"6px 0",borderBottom:i<acts.length-1?`1px solid ${C.bd}`:"none"}}><span style={{fontSize:13,fontWeight:600}}>{a.name}</span><span style={{fontSize:10,marginRight:6,background:C.s2,padding:"2px 6px",borderRadius:4,color:C.tm}}>{a.type}</span><p style={{fontSize:12,color:C.tm,margin:"2px 0 0"}}>{a.description}</p></div>))}</div>)}
        </div>)}
      </div>

      {/* DATES + WEATHER */}
      <div style={{display:"flex",gap:12,marginBottom:4}}>
        <div style={{flex:1}}><label style={lbl}>מתאריך</label><input style={inp} type="date" value={f.startDate} onChange={e=>upd("startDate",e.target.value)}/></div>
        <div style={{flex:1}}><label style={lbl}>עד תאריך</label><input style={inp} type="date" value={f.endDate} onChange={e=>upd("endDate",e.target.value)}/></div>
      </div>
      {(wL||weather||wE)&&(<div className="fadeIn" style={{background:C.ss,border:"1px solid rgba(56,189,248,0.2)",borderRadius:12,padding:12,marginBottom:16}}>
        {wL&&<div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:C.sk}}>{spin} טוען תחזית...</div>}
        {wE&&<p style={{fontSize:12,color:C.am}}>⚠️ {wE}</p>}
        {weather&&(<div><p style={{fontSize:13,fontWeight:600,color:C.sk,marginBottom:8}}>🌤️ תחזית מזג אוויר</p><div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>{weather.map((d,i)=>(<div key={i} style={{minWidth:80,textAlign:"center",background:C.s,borderRadius:10,padding:"8px 6px",flexShrink:0}}><div style={{fontSize:10,color:C.tm}}>{new Date(d.date).toLocaleDateString("he",{weekday:"short",day:"numeric",month:"numeric"})}</div><div style={{fontSize:20,margin:"4px 0"}}>{(WMO[d.code]||"🌡️").split(" ")[0]}</div><div style={{fontSize:13,fontWeight:600}}>{Math.round(d.mn)}°-{Math.round(d.mx)}°</div>{d.rain>0&&<div style={{fontSize:10,color:C.sk}}>💧{d.rain}מ"מ</div>}</div>))}</div><p style={{fontSize:11,color:C.tm,marginTop:6,textAlign:"center"}}>{wSum(weather)}</p></div>)}
      </div>)}

      <div style={{marginBottom:20}}><label style={lbl}>רמת ציוד</label><div style={{display:"flex",gap:8}}>{GL.map(g=>(<button key={g.id} onClick={()=>upd("gearLevel",g.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"12px 6px",background:f.gearLevel===g.id?C.as:C.s,border:`1px solid ${f.gearLevel===g.id?C.a:C.bd}`,borderRadius:12,cursor:"pointer",color:f.gearLevel===g.id?C.a:C.tm,fontFamily:"inherit"}}><span style={{fontSize:22}}>{g.icon}</span><span style={{fontSize:13,fontWeight:600}}>{g.label}</span><span style={{fontSize:10,textAlign:"center"}}>{g.d}</span></button>))}</div></div>

      {/* PARTICIPANTS */}
      <div style={{marginBottom:20}}>
        <label style={lbl}>משתתפים</label>
        {groups.length>0&&(<div style={{marginBottom:10}}><button onClick={()=>setShowG(!showG)} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",padding:"10px",background:C.os,border:`1px solid ${C.o}`,borderRadius:10,color:C.o,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}><I n="dl" s={16}/>ייבא מקבוצה</button>
          {showG&&(<div style={{background:C.s,border:`1px solid ${C.bd}`,borderRadius:10,marginTop:6,overflow:"hidden"}}>{groups.map(g=>(<button key={g.id} onClick={()=>importG(g)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"12px 14px",background:"none",border:"none",borderBottom:`1px solid ${C.bd}`,color:C.t,cursor:"pointer",fontFamily:"inherit",fontSize:14,textAlign:"right"}}><span style={{fontSize:22}}>{g.icon||"👥"}</span><div style={{flex:1}}><div style={{fontWeight:600}}>{g.name}</div><div style={{fontSize:11,color:C.tm}}>{g.members?.filter(m=>m.name).map(m=>m.name).join(", ")}</div></div></button>))}</div>)}
        </div>)}

          <input style={{...inp,flex:1,marginBottom:0}} placeholder={`משתתף ${i+1}`} value={p.name} onChange={e=>updP(p.id,"name",e.target.value)}/>
          <label style={{display:"flex",alignItems:"center",gap:4,fontSize:13,color:C.tm,cursor:"pointer",whiteSpace:"nowrap"}}><input type="checkbox" checked={p.isChild} onChange={e=>updP(p.id,"isChild",e.target.checked)}/>ילד/ה</label>
          {p.isChild&&<input style={{...inp,width:60,marginBottom:0}} type="number" placeholder="גיל" min="0" max="17" value={p.age} onChange={e=>updP(p.id,"age",e.target.value)}/>}
          {f.participants.length>1&&<button onClick={()=>rmP(p.id)} style={{background:"none",border:"none",color:C.r,cursor:"pointer",fontSize:16,padding:4}}>✕</button>}
        </div>))}
        <button onClick={addP} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.s2,border:`1px solid ${C.bd}`,borderRadius:10,color:C.a,cursor:"pointer",fontSize:13,fontWeight:500,fontFamily:"inherit"}}><I n="plus" s={16}/>הוסף משתתף</button>
      </div>
      <button onClick={doCreate} disabled={!ok} style={{width:"100%",padding:14,fontSize:17,fontWeight:700,background:C.a,color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"inherit",marginTop:8,opacity:ok?1:.5}}>🚀 צור טיול</button>
    </div>
  </div>);
}

/* ===== TRIP VIEW (with real-time listener) ===== */
function TripView({user,tripId,tab,setTab,onSave,onBack}){
  const[trip,setTrip]=useState(null);
  const[ni,setNI]=useState("");const[nc,setNC]=useState("");
  const[sf,setSF]=useState({day:"",title:"",notes:""});
  const[aiItems,setAI]=useState([]);const[aiL,setAIL]=useState(false);
  const[filter,setFi]=useState("all");const[actL2,setActL2]=useState(false);
  const[editCell,setEC]=useState(null);const[customTxt,setCT]=useState("");
  const[showShare,setShowShare]=useState(false);
  const[shareEmail,setShareEmail]=useState("");
  const[shareMsg,setShareMsg]=useState("");

  /* Real-time listener for this specific trip */
  useEffect(()=>{
    return db.collection("trips").doc(tripId).onSnapshot(snap=>{
      if(snap.exists)setTrip({id:snap.id,...snap.data()});
    });
  },[tripId]);

  if(!trip)return bigSpin;
  const isOwner=trip.ownerUid===user.uid;
  const ti=TT.find(t=>t.id===trip.type);const li=GL.find(g=>g.id===trip.gearLevel);
  const sv=t=>onSave(t);

  const toggle=id=>sv({...trip,gear:trip.gear.map(g=>g.id===id?{...g,packed:!g.packed}:g)});
  const addG=()=>{if(!ni.trim())return;sv({...trip,gear:[...trip.gear,{id:uid(),name:ni.trim(),category:nc.trim()||"כללי",packed:false,isAI:false}]});setNI("");setNC("");};
  const rmG=id=>sv({...trip,gear:trip.gear.filter(g=>g.id!==id)});

  const doAI=async()=>{if(!getApiKey()){showToast("הגדר מפתח Gemini API בהגדרות ⚙️","error");return;}setAIL(true);setAI([]);try{const res=await getAIGear(trip,trip.weather);setAI(res);showToast(`נמצאו ${res.length} המלצות ציוד`,"success");}catch(e){showToast("שגיאת AI: "+e.message,"error");}setAIL(false);};
  const addOne=item=>{sv({...trip,gear:[...trip.gear,{id:uid(),name:item.name,category:item.category,packed:false,isAI:true,reason:item.reason}]});setAI(p=>p.filter(i=>i.name!==item.name));};
  const addAll=()=>{const ng=aiItems.filter(i=>!trip.gear.find(g=>g.name===i.name)).map(i=>({id:uid(),name:i.name,category:i.category,packed:false,isAI:true,reason:i.reason}));sv({...trip,gear:[...trip.gear,...ng]});setAI([]);};
  const addS=()=>{if(!sf.day||!sf.title)return;sv({...trip,schedule:[...(trip.schedule||[]),{id:uid(),...sf}]});setSF({day:"",title:"",notes:""});};
  const rmS=id=>sv({...trip,schedule:trip.schedule.filter(s=>s.id!==id)});
  const fetchActs=async()=>{if(!getApiKey()){showToast("הגדר מפתח Gemini API בהגדרות ⚙️","error");return;}setActL2(true);try{const acts=await getActivities(trip.destination,TT.find(t=>t.id===trip.type)?.label);sv({...trip,activities:acts});showToast("נמצאו "+acts.length+" פעילויות!","success");}catch(e){showToast("שגיאה: "+e.message,"error");}setActL2(false);};

  /* SHARING */
  const doShare=async()=>{
    if(!shareEmail.trim()||!shareEmail.includes("@"))return;
    const em=shareEmail.trim().toLowerCase();
    if(trip.memberEmails?.includes(em)){setShareMsg("כבר משותף!");return;}
    const updated=[...(trip.memberEmails||[]),em];
    await db.collection("trips").doc(trip.id).update({memberEmails:updated});
    setShareEmail("");setShareMsg(`✅ שותף עם ${em}`);
  };
  const rmShare=async em=>{
    if(em===trip.ownerEmail)return;
    const updated=trip.memberEmails.filter(e=>e!==em);
    await db.collection("trips").doc(trip.id).update({memberEmails:updated});
  };

  const fG=filter==="packed"?trip.gear.filter(g=>g.packed):filter==="unpacked"?trip.gear.filter(g=>!g.packed):trip.gear;
  const pC=trip.gear?.filter(g=>g.packed).length||0,tC=trip.gear?.length||0,pr=tC?Math.round(pC/tC*100):0;
  const grouped={};fG.forEach(i=>{if(!grouped[i.category])grouped[i.category]=[];grouped[i.category].push(i);});
  const tbS=a=>({flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 8px",background:a?C.as:"none",border:"none",color:a?C.a:C.tm,fontSize:13,fontWeight:500,cursor:"pointer",borderRadius:10,fontFamily:"inherit"});
  const fS=a=>({padding:"6px 12px",fontSize:12,background:a?C.as:C.s2,border:`1px solid ${a?C.a:C.bd}`,borderRadius:20,color:a?C.a:C.tm,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"});

  return(<div style={{padding:"0 12px"}}>
    <div style={topBar}>
      <button onClick={onBack} style={bBtn}><I n="back"/>חזרה</button>
      <h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>{ti?.icon} {trip.name}</h2>
      <button onClick={()=>setShowShare(true)} aria-label="שתף טיול" style={{background:"none",border:"none",color:C.a,cursor:"pointer",padding:6}}><I n="share" s={20}/></button>
    </div>

    {/* SHARE MODAL */}
    {showShare&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setShowShare(false)}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.s,borderRadius:16,padding:20,width:"100%",maxWidth:400}} dir="rtl">
        <h3 style={{margin:"0 0 16px",fontSize:18,fontWeight:700}}>🔗 שיתוף טיול</h3>
        <p style={{fontSize:13,color:C.tm,marginBottom:12}}>הוסף אנשים לפי כתובת Gmail — הם יראו ויוכלו לערוך את הטיול בזמן אמת</p>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <input style={{...inp,flex:1,marginBottom:0}} placeholder="email@gmail.com" value={shareEmail} onChange={e=>setShareEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doShare()} dir="ltr"/>
          <button onClick={doShare} disabled={!isOwner} style={{background:C.a,color:"#fff",border:"none",borderRadius:10,padding:"0 16px",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>הוסף</button>
        </div>
        {!isOwner&&<p style={{fontSize:12,color:C.am,marginBottom:8}}>⚠️ רק יוצר הטיול יכול לשתף</p>}
        {shareMsg&&<p style={{fontSize:13,color:C.g,marginBottom:8}}>{shareMsg}</p>}
        <div style={{borderTop:`1px solid ${C.bd}`,paddingTop:12}}>
          <p style={{fontSize:12,fontWeight:600,color:C.tm,marginBottom:8}}>משתתפים בשיתוף:</p>
          {(trip.memberEmails||[]).map(em=>(<div key={em} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${C.bd}`}}>
            <span style={{flex:1,fontSize:14}}>{em}{em===trip.ownerEmail&&<span style={{fontSize:10,marginRight:6,background:C.as,color:C.a,padding:"1px 6px",borderRadius:4}}>יוצר</span>}</span>
            {isOwner&&em!==trip.ownerEmail&&<button onClick={()=>rmShare(em)} style={{background:"none",border:"none",color:C.r,cursor:"pointer",fontSize:12}}>הסר</button>}
          </div>))}
        </div>
        <button onClick={()=>setShowShare(false)} style={{width:"100%",padding:12,background:C.s2,border:`1px solid ${C.bd}`,borderRadius:10,color:C.t,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginTop:16}}>סגור</button>
      </div>
    </div>)}

    {/* META */}
    <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"0 4px 8px"}}>
      <span style={{fontSize:12,background:C.s2,padding:"5px 10px",borderRadius:20,color:C.tm}}>📍 {trip.destination}</span>
      <span style={{fontSize:12,background:C.s2,padding:"5px 10px",borderRadius:20,color:C.tm}}>📅 {trip.startDate}</span>
      <span style={{fontSize:12,background:C.s2,padding:"5px 10px",borderRadius:20,color:C.tm}}>{li?.icon} {li?.label}</span>
      <span style={{fontSize:12,background:C.s2,padding:"5px 10px",borderRadius:20,color:C.tm}}>👥 {trip.participants?.length}</span>
      {trip.mapsUrl&&<a href={trip.mapsUrl} target="_blank" rel="noopener" style={{fontSize:12,background:C.as,padding:"5px 10px",borderRadius:20,color:C.a,textDecoration:"none"}}>📍 מפה</a>}
    </div>

    {/* WEATHER STRIP */}
    {trip.weather?.length>0&&(<div style={{background:C.ss,border:"1px solid rgba(56,189,248,0.15)",borderRadius:10,padding:"8px 12px",marginBottom:8}}><div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>{trip.weather.map((d,i)=>(<div key={i} style={{textAlign:"center",minWidth:52,flexShrink:0}}><div style={{fontSize:9,color:C.tm}}>{new Date(d.date).toLocaleDateString("he",{weekday:"short"})}</div><div style={{fontSize:16}}>{(WMO[d.code]||"🌡️").split(" ")[0]}</div><div style={{fontSize:11,fontWeight:600}}>{Math.round(d.mn)}°-{Math.round(d.mx)}°</div></div>))}</div></div>)}

    {/* PROGRESS */}
    <div style={{padding:"12px 4px 8px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,color:C.tm}}>התקדמות אריזה</span><span style={{fontSize:14,fontWeight:700,color:C.a}}>{pr}%</span></div><div style={{height:8,background:C.s2,borderRadius:8,overflow:"hidden"}}><div style={{height:"100%",borderRadius:8,width:`${pr}%`,background:pr===100?C.g:pr>50?C.am:C.r,transition:"width .4s"}}/></div><p style={{fontSize:12,color:C.tm,marginTop:4,textAlign:"center"}}>{pC} מתוך {tC} נארזו</p></div>

    {/* TABS */}
    <div style={{display:"flex",gap:4,padding:"8px 4px",borderBottom:`1px solid ${C.bd}`,marginBottom:12}}>
      <button style={tbS(tab==="gear")} onClick={()=>setTab("gear")}><I n="list" s={16}/>ציוד</button>
      <button style={tbS(tab==="schedule")} onClick={()=>setTab("schedule")}><I n="cal" s={16}/>לו״ז</button>
      <button style={tbS(tab==="food")} onClick={()=>setTab("food")}>🍽️ אוכל</button>
      <button style={tbS(tab==="people")} onClick={()=>setTab("people")}><I n="user" s={16}/>אנשים</button>
      <button style={tbS(tab==="acts")} onClick={()=>setTab("acts")}>🎯 פעילויות</button>
    </div>

    {/* GEAR TAB */}
    {tab==="gear"&&(<div>
      <button onClick={doAI} disabled={aiL} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:12,background:C.ps,border:`1px solid ${C.p}`,borderRadius:12,color:C.p,fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:12}}>{aiL?<>{spin} AI חושב...</>:<><I n="star" s={18}/>העזר ב-AI להכנת רשימה</>}</button>
      {trip.weather&&<p style={{fontSize:11,color:C.sk,textAlign:"center",marginTop:-8,marginBottom:10}}>🌤️ ה-AI מתחשב בתחזית מזג האוויר</p>}
      {aiItems.length>0&&(<div style={{background:C.ps,border:"1px solid rgba(167,139,250,0.2)",borderRadius:12,padding:14,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><h4 style={{margin:0,fontSize:14,color:C.p}}>✨ המלצות AI</h4><button onClick={addAll} style={{background:C.p,color:"#fff",border:"none",borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>הוסף הכל</button></div>
        {aiItems.map((item,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid rgba(167,139,250,0.1)"}}><div style={{flex:1}}><span style={{fontSize:14}}>{item.name}</span>{item.reason&&<div style={{fontSize:11,color:C.tm}}>{item.reason}</div>}</div><button onClick={()=>addOne(item)} style={{background:C.p,color:"#fff",border:"none",borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}><I n="plus" s={14}/></button></div>))}
      </div>)}
      <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:4}}><button style={fS(filter==="all")} onClick={()=>setFi("all")}>הכל ({tC})</button><button style={fS(filter==="unpacked")} onClick={()=>setFi("unpacked")}>לא נארז ({tC-pC})</button><button style={fS(filter==="packed")} onClick={()=>setFi("packed")}>נארז ✓ ({pC})</button></div>
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}><input style={{...inp,flex:1,marginBottom:0}} placeholder="פריט חדש..." value={ni} onChange={e=>setNI(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addG()}/><input style={{...inp,width:90,marginBottom:0}} placeholder="קטגוריה" value={nc} onChange={e=>setNC(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addG()}/><button onClick={addG} style={{background:C.a,color:"#fff",border:"none",borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}><I n="plus" s={16}/></button></div>
      {Object.entries(grouped).map(([cat,items])=>(<div key={cat} style={{marginBottom:16}}>

          <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${item.packed?C.g:C.bd}`,background:item.packed?C.g:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff"}}>{item.packed&&<I n="check" s={14}/>}</div>
          <div style={{flex:1}}><span style={{fontSize:14,textDecoration:item.packed?"line-through":"none",opacity:item.packed?.6:1}}>{item.name}{item.isAI&&<span style={{display:"inline-block",marginRight:6,fontSize:9,fontWeight:700,background:C.ps,color:C.p,padding:"1px 6px",borderRadius:4,verticalAlign:"middle"}}>AI</span>}</span>{item.childNote&&<div style={{fontSize:11,color:C.am}}>{item.childNote}</div>}{item.reason&&<div style={{fontSize:11,color:C.tm,fontStyle:"italic"}}>{item.reason}</div>}</div>
          <button onClick={e=>{e.stopPropagation();rmG(item.id);}} aria-label="הסר פריט" style={{background:"none",border:"none",color:C.td,cursor:"pointer",padding:4,opacity:.5}}><I n="trash" s={14}/></button>
        </div>))}
      </div>))}
    </div>)}

    {/* SCHEDULE TAB */}
    {tab==="schedule"&&(<div>
      <div style={{background:C.s,borderRadius:12,padding:14,marginBottom:16}}>
        <div style={{display:"flex",gap:12}}><div style={{flex:1}}><label style={lbl}>יום / תאריך</label><input style={inp} placeholder="יום 1" value={sf.day} onChange={e=>setSF(p=>({...p,day:e.target.value}))}/></div><div style={{flex:2}}><label style={lbl}>כותרת</label><input style={inp} placeholder="עליה לפסגה" value={sf.title} onChange={e=>setSF(p=>({...p,title:e.target.value}))}/></div></div>
        <label style={lbl}>הערות</label><textarea style={{...inp,minHeight:80,resize:"vertical"}} placeholder="פירוט..." value={sf.notes} onChange={e=>setSF(p=>({...p,notes:e.target.value}))}/>

        <button onClick={()=>rmS(item.id)} aria-label="הסר מלו״ז" style={{background:"none",border:"none",color:C.td,cursor:"pointer",padding:4,opacity:.5}}><I n="trash" s={14}/></button>
      </div>))}</div>)}
    </div>)}

    {/* PEOPLE TAB */}

          const m={...meals,[day]:{...(meals[day]||{}),[meal]:{type,custom:custom||"",area:area||""}}};
          sv({...trip,meals:m});
        };
        const filled=days.reduce((n,d)=>n+MEALS.filter(m=>meals[d]?.[m]?.type).length,0);
        const total=days.length*3;
        const mapsLink=(area)=>`https://www.google.com/maps/search/מסעדות+${encodeURIComponent(area||trip.destination)}`;
        return(<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <span style={{fontSize:14,fontWeight:600}}>🍽️ תכנון ארוחות</span>

          </div>
          {days.map((day,di)=>{
            const dayName=new Date(day).toLocaleDateString("he",{weekday:"long",day:"numeric",month:"numeric"});
            return(<div key={day} className="fadeIn" style={{background:C.s,borderRadius:14,padding:14,marginBottom:10,border:`1px solid ${C.bd}`}}>
              <div style={{fontSize:13,fontWeight:700,color:C.a,marginBottom:10}}>📅 יום {di+1} — {dayName}</div>
              {MEALS.map(meal=>{
                const cur=meals[day]?.[meal]||{type:"",custom:"",area:""};
                const preset=MEAL_PRESETS.find(p=>p.id===cur.type);
                const isEditing=editCell===day+meal;
                const cellKey=day+meal;
                return(<div key={meal} style={{marginBottom:10}}>
                  <div style={{fontSize:12,fontWeight:600,color:C.tm,marginBottom:4}}>{MEAL_NAMES[meal]}</div>
                  {/* DISPLAY MODE — meal is set and not editing */}
                  {!isEditing&&cur.type?(<div>
                    <div onClick={()=>{setEC(cellKey);setCT(cur.custom);}} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:cur.type==="skip"?"transparent":C.s2,borderRadius:10,cursor:"pointer",border:`1px solid ${C.bd}`}}>
                      <span style={{fontSize:18}}>{preset?.icon||"✏️"}</span>
                      <span style={{fontSize:14,flex:1}}>{cur.type==="custom"?cur.custom:preset?.label}{cur.type==="restaurant"&&cur.area?` (${cur.area})`:""}</span>
                      <span style={{fontSize:11,color:C.tm}}>שנה</span>
                    </div>
                    {cur.type==="restaurant"&&(<a href={mapsLink(cur.area)} target="_blank" rel="noopener" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:C.a,textDecoration:"none",padding:"4px 10px",background:C.as,borderRadius:8,marginTop:4}}>📍 חפש מסעדות {cur.area?`ב${cur.area}`:`ב${trip.destination}`}</a>)}
                  </div>)
                  /* EDIT MODE — choosing meal type */
                  :(<div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                      {MEAL_PRESETS.map(p=>(<button key={p.id} onClick={()=>{
                        if(p.id==="restaurant"){setMeal(day,meal,"restaurant","",cur.area||trip.destination);setEC(cellKey+"_area");}
                        else{setMeal(day,meal,p.id,"");setEC(null);}
                      }} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px",background:cur.type===p.id?C.as:C.s2,border:`1px solid ${cur.type===p.id?C.a:C.bd}`,borderRadius:8,cursor:"pointer",fontSize:12,color:cur.type===p.id?C.a:C.tm,fontFamily:"inherit"}}><span>{p.icon}</span><span>{p.label}</span></button>))}
                    </div>
                    {/* RESTAURANT AREA INPUT */}
                    {editCell===cellKey+"_area"&&(<div className="fadeIn" style={{background:C.as,borderRadius:10,padding:10,marginBottom:6}}>
                      <div style={{fontSize:12,fontWeight:600,color:C.a,marginBottom:6}}>📍 באיזה אזור תרצו לאכול?</div>
                      <div style={{display:"flex",gap:6}}>
                        <input style={{...inp,flex:1,marginBottom:0,fontSize:13}} placeholder={trip.destination} value={customTxt||cur.area||trip.destination} onChange={e=>setCT(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){setMeal(day,meal,"restaurant","",customTxt||trip.destination);setEC(null);setCT("");}}}/>
                        <button onClick={()=>{setMeal(day,meal,"restaurant","",customTxt||trip.destination);setEC(null);setCT("");}} style={{background:C.a,color:"#fff",border:"none",borderRadius:8,padding:"0 12px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>✓</button>
                      </div>
                      <a href={mapsLink(customTxt||cur.area||trip.destination)} target="_blank" rel="noopener" style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:C.a,textDecoration:"none",marginTop:6}}>🔍 חפש מסעדות ב-Google Maps</a>
                    </div>)}
                    {/* FREE TEXT INPUT */}
                    {editCell!==cellKey+"_area"&&(<div style={{display:"flex",gap:6}}>
                      <input style={{...inp,flex:1,marginBottom:0,fontSize:13}} placeholder="או כתוב משהו אחר..." value={editCell===cellKey?customTxt:""} onChange={e=>{setCT(e.target.value);setEC(cellKey);}} onKeyDown={e=>{if(e.key==="Enter"&&customTxt.trim()){setMeal(day,meal,"custom",customTxt.trim());setEC(null);setCT("");}}}/>
                      {customTxt.trim()&&editCell===cellKey&&<button onClick={()=>{setMeal(day,meal,"custom",customTxt.trim());setEC(null);setCT("");}} style={{background:C.a,color:"#fff",border:"none",borderRadius:8,padding:"0 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✓</button>}
                    </div>)}
                    {isEditing&&cur.type&&<button onClick={()=>setEC(null)} style={{background:"none",border:"none",color:C.tm,fontSize:11,cursor:"pointer",marginTop:4,fontFamily:"inherit"}}>ביטול</button>}
                  </div>)}
                </div>);
              })}
            </div>);
          })}
        </div>);
      })()}

    {/* PEOPLE TAB */}
    {tab==="people"&&(<div>{trip.participants?.map(p=>(<div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:14,background:C.s,borderRadius:12,marginBottom:8}}>
      <div style={{fontSize:28}}>{p.isChild?"👧":"🧑"}</div>
      <div><span style={{fontSize:15,fontWeight:600}}>{p.name||"ללא שם"}</span>{p.isChild&&<div style={{fontSize:12,color:C.am}}>ילד/ה, גיל {p.age}</div>}</div>
    </div>))}</div>)}

    {/* ACTIVITIES TAB */}
    {tab==="acts"&&(<div>
      <button onClick={fetchActs} disabled={actL2} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:12,background:C.os,border:`1px solid ${C.o}`,borderRadius:12,color:C.o,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:14}}>{actL2?<>{spin} מחפש פעילויות...</>:<>🎯 {trip.activities?.length?"רענן פעילויות":"חפש פעילויות באזור"}</>}</button>
      {trip.mapsUrl&&<a href={trip.mapsUrl} target="_blank" rel="noopener" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:12,background:C.as,border:`1px solid ${C.a}`,borderRadius:12,color:C.a,fontSize:14,fontWeight:600,textDecoration:"none",marginBottom:14}}>📍 פתח את {trip.destination} ב-Google Maps</a>}
      {!trip.activities?.length&&!actL2&&<div style={{textAlign:"center",padding:"40px 16px",color:C.tm}}><div style={{fontSize:48,marginBottom:8}}>🎯</div><p>לחץ למעלה כדי לחפש פעילויות ואטרקציות באזור {trip.destination}</p></div>}
      {trip.activities?.map((a,i)=>(<div key={i} style={{background:C.s,borderRadius:12,padding:14,marginBottom:8,border:`1px solid ${C.bd}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:13,fontWeight:600}}>{a.name}</span><span style={{fontSize:10,background:C.os,color:C.o,padding:"2px 8px",borderRadius:6}}>{a.type}</span></div>
        <p style={{fontSize:13,color:C.tm,margin:"6px 0 0"}}>{a.description}</p>
        <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.name+" "+trip.destination)}`} target="_blank" rel="noopener" style={{fontSize:12,color:C.a,textDecoration:"none",marginTop:4,display:"inline-block"}}>🔍 חפש במפות</a>
      </div>))}
    </div>)}
  </div>);
}

/* ===== GROUPS LIST ===== */
function GList({groups,onBack,onEdit,onCreate,onDel}){
  return(<div style={{padding:"0 12px"}}>
    <div style={topBar}><button onClick={onBack} style={bBtn}><I n="back"/>חזרה</button><h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>קבוצות</h2><div style={{width:70}}/></div>
    <p style={{fontSize:13,color:C.tm,textAlign:"center",marginBottom:16}}>צור קבוצות קבועות כדי להוסיף אותן בקליק לטיולים</p>
    {groups.length===0?(<div style={{textAlign:"center",padding:"48px 16px",background:C.s,borderRadius:16}}><div style={{fontSize:48}}>👥</div><p style={{fontSize:16,fontWeight:600,margin:"12px 0 4px"}}>אין קבוצות עדיין</p></div>)
    :(<div style={{display:"flex",flexDirection:"column",gap:10}}>{groups.map(g=>(<div key={g.id} style={{background:C.s,borderRadius:12,padding:14,border:`1px solid ${C.bd}`,display:"flex",alignItems:"center",gap:12}}>
      <div style={{fontSize:28}}>{g.icon||"👥"}</div>
      <div style={{flex:1,cursor:"pointer"}} onClick={()=>onEdit(g)}><h3 style={{margin:0,fontSize:16,fontWeight:600}}>{g.name}</h3><p style={{margin:"2px 0 0",fontSize:12,color:C.tm}}>{g.members?.length||0} אנשים</p></div>
      <button onClick={()=>onEdit(g)} aria-label="ערוך קבוצה" style={{background:"none",border:"none",color:C.a,cursor:"pointer",padding:6}}><I n="edit" s={16}/></button>
      <button onClick={()=>onDel(g)} aria-label="מחק קבוצה" style={{background:"none",border:"none",color:C.td,cursor:"pointer",padding:6}}><I n="trash" s={16}/></button>
    </div>))}</div>)}
    <button onClick={onCreate} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:14,background:C.o,color:"#fff",border:"none",borderRadius:14,fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit",marginTop:16}}><I n="plus" s={20}/>קבוצה חדשה</button>
  </div>);
}

/* ===== EDIT GROUP ===== */
function GEdit({group,onBack,onSave}){
  const isN=!group;
  const[f,sF]=useState(group||{id:uid(),name:"",icon:"👥",members:[{id:uid(),name:"",isChild:false,age:""}]});
  const upd=(k,v)=>sF(p=>({...p,[k]:v}));
  const addM=()=>sF(p=>({...p,members:[...p.members,{id:uid(),name:"",isChild:false,age:""}]}));
  const updM=(id,k,v)=>sF(p=>({...p,members:p.members.map(m=>m.id===id?{...m,[k]:v}:m)}));
  const rmM=id=>sF(p=>({...p,members:p.members.filter(m=>m.id!==id)}));
  const icons=["👥","👨‍👩‍👧‍👦","💼","🎉","⚽","🏫","🎸","🏋️"];
  const ok=f.name.trim().length>0;

  return(<div style={{padding:"0 12px"}}>
    <div style={topBar}><button onClick={onBack} style={bBtn}><I n="back"/>חזרה</button><h2 style={{fontSize:17,fontWeight:700,margin:0,flex:1,textAlign:"center"}}>{isN?"קבוצה חדשה":"עריכת קבוצה"}</h2><div style={{width:70}}/></div>
    <div style={{padding:"8px 0"}}>
      <div style={{marginBottom:20}}><label style={lbl}>שם הקבוצה</label><input style={inp} placeholder="למשל: משפחה, חברים" value={f.name} onChange={e=>upd("name",e.target.value)}/></div>
      <div style={{marginBottom:20}}><label style={lbl}>אייקון</label><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{icons.map(ic=>(<button key={ic} onClick={()=>upd("icon",ic)} style={{fontSize:28,background:f.icon===ic?C.os:C.s,border:`2px solid ${f.icon===ic?C.o:C.bd}`,borderRadius:10,width:48,height:48,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{ic}</button>))}</div></div>
      <div style={{marginBottom:20}}><label style={lbl}>חברי הקבוצה</label>
        {f.members.map((m,i)=>(<div key={m.id} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
          <input style={{...inp,flex:1,marginBottom:0}} placeholder={`חבר/ה ${i+1}`} value={m.name} onChange={e=>updM(m.id,"name",e.target.value)}/>
          <label style={{display:"flex",alignItems:"center",gap:4,fontSize:13,color:C.tm,cursor:"pointer",whiteSpace:"nowrap"}}><input type="checkbox" checked={m.isChild} onChange={e=>updM(m.id,"isChild",e.target.checked)}/>ילד/ה</label>
          {m.isChild&&<input style={{...inp,width:60,marginBottom:0}} type="number" placeholder="גיל" min="0" max="17" value={m.age} onChange={e=>updM(m.id,"age",e.target.value)}/>}
          {f.members.length>1&&<button onClick={()=>rmM(m.id)} style={{background:"none",border:"none",color:C.r,cursor:"pointer",fontSize:16,padding:4}}>✕</button>}
        </div>))}
        <button onClick={addM} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 14px",background:C.s2,border:`1px solid ${C.bd}`,borderRadius:10,color:C.o,cursor:"pointer",fontSize:13,fontWeight:500,fontFamily:"inherit"}}><I n="plus" s={16}/>הוסף חבר/ה</button>
      </div>
      <button onClick={()=>ok&&onSave({...f,name:f.name.trim(),members:f.members.filter(m=>m.name.trim())})} disabled={!ok} style={{width:"100%",padding:14,fontSize:17,fontWeight:700,background:C.o,color:"#fff",border:"none",borderRadius:14,cursor:"pointer",fontFamily:"inherit",opacity:ok?1:.5}}>{isN?"✨ צור קבוצה":"💾 שמור שינויים"}</button>
    </div>
  </div>);
}

/* ===== TOAST ===== */
const _toasts={set:null};
function showToast(msg,type="info"){if(_toasts.set)_toasts.set(p=>[...p,{id:uid(),msg,type,ts:Date.now()}]);}
function Toasts(){const[list,setList]=useState([]);_toasts.set=setList;useEffect(()=>{if(!list.length)return;const oldest=list[0];const t=setTimeout(()=>setList(p=>p.filter(x=>x.id!==oldest.id)),3500);return()=>clearTimeout(t);},[list]);
  return(<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:400,display:"flex",flexDirection:"column",gap:8,width:"90%",maxWidth:400,pointerEvents:"none"}}>{list.map(t=>(<div key={t.id} className="fadeIn" style={{padding:"12px 16px",borderRadius:12,fontSize:14,fontWeight:500,pointerEvents:"auto",textAlign:"center",background:t.type==="error"?"rgba(239,68,68,0.95)":t.type==="success"?"rgba(34,197,94,0.95)":"rgba(79,140,255,0.95)",color:"#fff",boxShadow:"0 4px 20px rgba(0,0,0,0.3)"}}>{t.msg}</div>))}</div>);
}

/* ===== ERROR BOUNDARY ===== */
class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){console.error("TripKit crash:",e,info);}
  render(){if(this.state.err)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:24,textAlign:"center",background:C.bg,color:C.t}} dir="rtl"><div style={{fontSize:64,marginBottom:16}}>💥</div><h2 style={{fontSize:22,fontWeight:700,marginBottom:8}}>משהו השתבש</h2><p style={{fontSize:14,color:C.tm,marginBottom:24}}>{this.state.err.message}</p><button onClick={()=>window.location.reload()} style={{padding:"12px 32px",background:C.a,color:"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>🔄 רענן את האפליקציה</button></div>);return this.props.children;}
}

/* ===== CONFIRM MODAL ===== */
function Confirm({msg,onOk,onCancel}){
  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onCancel}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.s,borderRadius:16,padding:24,width:"100%",maxWidth:340,textAlign:"center"}} dir="rtl">
      <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
      <p style={{fontSize:16,fontWeight:600,marginBottom:20,lineHeight:1.6}}>{msg}</p>
      <div style={{display:"flex",gap:10}}>
        <button onClick={onOk} style={{flex:1,padding:12,background:C.r,color:"#fff",border:"none",borderRadius:10,fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>מחק</button>
        <button onClick={onCancel} style={{flex:1,padding:12,background:C.s2,border:`1px solid ${C.bd}`,borderRadius:10,color:C.t,fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
      </div>
    </div>
  </div>);
}

/* ===== SETTINGS ===== */
function Settings({onClose}){
  const[key,setKey]=useState(getApiKey());
  const[saved,setSaved]=useState(false);
  const detectedModel=localStorage.getItem("tk_gemini_model")||"לא זוהה עדיין";
  const doSave=()=>{setApiKey(key.trim());localStorage.removeItem("tk_gemini_model");setSaved(true);setTimeout(()=>setSaved(false),2000);};
  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.s,borderRadius:16,padding:20,width:"100%",maxWidth:400}} dir="rtl">
      <h3 style={{margin:"0 0 16px",fontSize:18,fontWeight:700}}>⚙️ הגדרות</h3>
      <label style={lbl}>מפתח Gemini API</label>
      <p style={{fontSize:12,color:C.tm,marginBottom:8}}>נדרש לפיצ'רים של AI (המלצות ציוד ופעילויות). המפתח נשמר רק במכשיר שלך.</p>
      <input style={{...inp,direction:"ltr",textAlign:"left"}} type="password" placeholder="AIza..." value={key} onChange={e=>setKey(e.target.value)}/>
      <p style={{fontSize:11,color:C.td,marginBottom:8}}>ניתן להשיג ב- <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style={{color:C.a}}>Google AI Studio</a></p>
      <p style={{fontSize:11,color:C.tm,marginBottom:12}}>🤖 מודל פעיל: <span style={{color:C.a,direction:"ltr",display:"inline-block"}}>{detectedModel}</span></p>
      {saved&&<p style={{fontSize:13,color:C.g,marginBottom:8}}>✅ נשמר! המודל יזוהה אוטומטית בקריאה הבאה.</p>}
      <div style={{display:"flex",gap:8}}>
        <button onClick={doSave} style={{flex:1,padding:12,background:C.a,color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>💾 שמור</button>
        <button onClick={onClose} style={{flex:1,padding:12,background:C.s2,border:`1px solid ${C.bd}`,borderRadius:10,color:C.t,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>סגור</button>
      </div>
    </div>
  </div>);
}

/* ===== CHANGELOG ===== */
function Changelog({onClose}){
  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.s,borderRadius:16,padding:20,width:"100%",maxWidth:400,maxHeight:"80vh",overflow:"auto"}} dir="rtl">
      <h3 style={{margin:"0 0 16px",fontSize:18,fontWeight:700}}>📋 מה חדש?</h3>
      {CLOG.map(v=>(<div key={v.v} style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:14,fontWeight:700,color:C.a}}>v{v.v}</span><span style={{fontSize:11,color:C.tm}}>{v.d}</span></div>
        {v.c.map((c,i)=>(<div key={i} style={{fontSize:13,color:C.t,padding:"3px 0",paddingRight:16,position:"relative"}}><span style={{position:"absolute",right:0,color:C.g}}>✓</span>{c}</div>))}
      </div>))}
      <button onClick={onClose} style={{width:"100%",padding:12,background:C.s2,border:`1px solid ${C.bd}`,borderRadius:10,color:C.t,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginTop:8}}>סגור</button>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
